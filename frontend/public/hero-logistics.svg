  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect y="520" width="1200" height="280" fill="url(#road)"/>
  <rect y="518" width="1200" height="6" fill="#C8102E" opacity="0.85"/>
  <g opacity="0.15" fill="#1B2B4B">
