    <rect x="220" y="120" width="100" height="380" rx="4"/>
    <rect x="360" y="200" width="140" height="300" rx="4"/>
    <rect x="900" y="160" width="130" height="340" rx="4"/>
    <rect x="1040" y="220" width="100" height="280" rx="4"/>
  </g>
  <ellipse cx="600" cy="560" rx="420" ry="28" fill="#000" opacity="0.25"/>
