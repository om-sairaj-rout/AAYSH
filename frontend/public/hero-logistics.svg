<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Logistics and express delivery">
  <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8eef5"/>
    <stop offset="55%" stop-color="#cfd9e6"/>
    <stop offset="100%" stop-color="#1B2B4B"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2a3f5f"/>
